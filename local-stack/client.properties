# Security protocol
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER

# SASL OAUTH configuration.
# Apache Kafka 4.1+ takes the client credentials from dedicated properties, and
# the JAAS config only names the login module. Older clients carry them inside
# sasl.jaas.config instead — see client_pre_ak4.properties.
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
sasl.oauthbearer.client.credentials.client.id=app-1
sasl.oauthbearer.client.credentials.client.secret=app-1-secret

sasl.oauthbearer.token.endpoint.url=https://oidc.localhost/realms/conduktor-realm/protocol/openid-connect/token
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
# Your IdP may require configuring sub claim name. If so, make sure it matches the value of GATEWAY_OAUTH_SUB_CLAIM_NAME in gateway-values.yaml.
sasl.oauthbearer.sub.claim.name=azp

# SSL settings — the Gateway external listener uses one-way TLS
# (sslClientAuth: NONE), so the client only needs a truststore.
ssl.truststore.type=JKS
ssl.truststore.location=./truststore.jks
ssl.truststore.password=conduktor
