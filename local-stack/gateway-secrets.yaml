#####
# Secrets for Conduktor Gateway
# In real customer environment, secrets should be managed by a secret manager and not sit unencrypted in a git repository !
#####
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: conduktor
type: Opaque
stringData: # use stringData to avoid base64 encoding for demo. Don't do this in production and rely on secret manager to provide secrets
  GATEWAY_LICENSE_KEY: "<conduktor license>" # This gets replaced with content of LICENSE environment variable

  # API admin user :  "admin" / "adminP4ss!"
  GATEWAY_ADMIN_API_USERS: "[{\"username\": \"admin\", \"password\": \"adminP4ss!\", \"admin\": true}]"

  # Backend kafka configuration secrets
  KAFKA_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username='kafka-admin' password='kafka-admin-password';"

  # random key of 256 bits long encoded in base64 generated with the command "openssl rand -base64 32"
  GATEWAY_USER_POOL_SECRET_KEY: "vrkiI5mKQoVmwcF6y3sg4N+T3NhAIHc7WLUtsHkulhc="

  # Gateway Kafka client truststore password (matches trust-manager Bundle password)
  KAFKA_SSL_TRUSTSTORE_PASSWORD: "conduktor"

  # Note: GATEWAY_SSL_*_PASSWORD and GATEWAY_HTTPS_KEY_STORE_PASSWORD are
  # injected by the helm chart from tls.keystore.passwordSecretRef
  # (conduktor-gateway-jks-password-secret) when tls.certManager.enabled.

  # Need to override JVM truststore to reach OIDC provider
  # JVM-default truststore — used for HTTPS calls Gateway makes that go
  # through the JVM HTTP client (OIDC JWKS fetch, etc.). Points to the
  # ext-services-trust Bundle (contains ext-services-ca which signs keycloak).
  JAVA_TOOL_OPTIONS: >-
    -Djavax.net.ssl.trustStore=/etc/conduktor/tls/ext-services-trust/truststore.jks
    -Djavax.net.ssl.trustStorePassword=conduktor
    -Djavax.net.ssl.trustStoreType=JKS

  # Listener mTLS truststore password (gateway-clients-trust). Required because
  # tls.certManager.truststore.enabled is false and we wire the path ourselves
  # via gateway.env.GATEWAY_SSL_TRUST_STORE_PATH.
  GATEWAY_SSL_TRUST_STORE_PASSWORD: "conduktor"
