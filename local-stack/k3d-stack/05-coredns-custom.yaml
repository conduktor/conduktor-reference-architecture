apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  rewrite.override: |
    # Rewrite oidc.localhost to internal Keycloak service so Console can reach it server-side for OIDC discovery and token exchange
    rewrite name regex oidc\.localhost keycloak.cdk-deps.svc.cluster.local answer auto